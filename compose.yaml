# PandaNote single-instance VPS deployment (S18): Caddy HTTPS edge -> one Node app
# with one persistent private data volume. See ops/DEPLOYMENT.md.
#
#   cp ops/production.env.example .env     # edit DOMAIN/ORIGIN, keep it private
#   npm run image:build                 # clean Git; set PANDANOTE_TAG to printed version
#   docker compose --profile ops run --rm --no-build migrate
#   docker compose --profile ops run --rm --no-build --no-deps -T setup-token # one-time token
#   docker compose up -d --no-build
#
# Never run two app containers against one data volume and never run migrate while
# the app is running (the commands above and in the upgrade runbook enforce order).
name: ${COMPOSE_PROJECT_NAME:-pandanote}

x-app: &app-base
  image: pandanote:${PANDANOTE_TAG:-local}
  build:
    context: .
    dockerfile: ops/Dockerfile
    # Low-level builds require metadata; prefer the clean-source image wrapper.
    args:
      PANDANOTE_VERSION: ${PANDANOTE_TAG:-}
      PANDANOTE_COMMIT: ${PANDANOTE_COMMIT:-}
      PANDANOTE_COMMITTED_AT: ${PANDANOTE_COMMITTED_AT:-}
  environment: &app-env
    ORIGIN: ${ORIGIN:?Set ORIGIN to the canonical public https origin, e.g. https://notes.example.com}
    DATA_DIR: /data
    NODE_ENV: production
    # Exactly the Caddy container's fixed address on the private edge network.
    TRUSTED_PROXY_IPS: ${EDGE_PROXY_IP:-172.28.0.2}
    BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-64G}
    DISK_RESERVE_BYTES: ${DISK_RESERVE_BYTES:-}
  volumes:
    - pandanote-data:/data
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *app-base
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Adapter-node drains HTTP, then the app closes SQLite/WAL; allow active backups to finish.
    stop_grace_period: 60s
    # Bounded for the documented 2-core/4-GB VPS; raise only after measuring.
    mem_limit: ${APP_MEM_LIMIT:-3g}
    cpus: ${APP_CPUS:-2}
    networks:
      edge:
        ipv4_address: ${APP_IP:-172.28.0.10}
    # No published ports: only the proxy reaches the app.
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  # One-shot operator tasks. They share the same data volume; run them only with
  # the app stopped (`docker compose stop app`).
  migrate:
    <<: *app-base
    profiles: [ops]
    command: ['node', 'scripts/migrate.ts']
    network_mode: none
  setup-token:
    <<: *app-base
    profiles: [ops]
    command: ['node', 'scripts/setup-token.ts']
    network_mode: none
  recover-auth:
    <<: *app-base
    profiles: [ops]
    command: ['node', 'scripts/auth-recover.ts']
    network_mode: none
  reindex:
    <<: *app-base
    profiles: [ops]
    command: ['node', 'scripts/reindex.ts']
    network_mode: none

  proxy:
    image: docker.io/library/caddy:2.11.6-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public host name (and :port only for local drills)}
      BODY_SIZE_LIMIT_CADDY: ${BODY_SIZE_LIMIT_CADDY:-64GB}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        ipv4_address: ${EDGE_PROXY_IP:-172.28.0.2}
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.28.0.0/24}

volumes:
  pandanote-data:
  caddy-data:
  caddy-config:

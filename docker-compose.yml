services:
  pandanote:
    image: localhost/pandanote:latest
    container_name: pandanote
    restart: unless-stopped
    environment:
      ORIGIN: https://notes.example.com
    expose:
      - '3000'
    volumes:
      - ./data:/data
    networks:
      - proxynet

networks:
  proxynet:
    external: true # the Docker network your Caddy container is on
